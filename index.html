<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Kart - Ajay Kirana & General Store</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#1b7f3a;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
}

.search{
  padding:15px;
  background:white;
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:10px 15px;
  background:white;
}

.categories button{
  border:0;
  padding:10px 15px;
  border-radius:20px;
  background:#e8f5ec;
  white-space:nowrap;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

.product{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px #ddd;
}

.product h3{
  margin:0 0 8px;
  font-size:17px;
}

.price{
  color:#1b7f3a;
  font-weight:bold;
}

.product button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#1b7f3a;
  color:white;
  font-size:15px;
}

.delivery{
  background:white;
  margin:15px;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}

.delivery h2{
  margin-top:0;
}

.delivery input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.location-btn{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#4285f4;
  color:white;
  font-size:15px;
}

.order-btn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#25d366;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#locationStatus{
  font-size:14px;
  color:#555;
}

.cart{
  position:fixed;
  bottom:15px;
  left:15px;
  right:15px;
  background:#222;
  color:white;
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart button{
  background:#25d366;
  border:0;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🛒 Daily Kart</h1>
<p>Ajay Kirana & General Store</p>
</header>

<div class="search">
<input
id="search"
type="text"
placeholder="🔍 Search products..."
>
</div>

<div class="categories">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('dal')">Dal</button>
<button onclick="filterProducts('grocery')">Grocery</button>
<button onclick="filterProducts('masala')">Masala</button>
</div>

<div class="products" id="products"></div>

<div class="delivery">

<h2>🛵 Delivery Details</h2>

<input
id="customerName"
type="text"
placeholder="👤 Your Name"
>

<input
id="mobile"
type="tel"
placeholder="📞 Mobile Number"
>

<input
id="address"
type="text"
placeholder="🏠 Full Delivery Address"
>

<button
class="location-btn"
onclick="shareLocation()"
>
📍 Use My Location
</button>

<p id="locationStatus">
Location not added
</p>

<button
class="order-btn"
onclick="order()"
>
🛒 Place Order on WhatsApp
</button>

</div>

<div class="cart">

<span>
🛒 Cart: <b id="count">0</b> items
</span>

<button onclick="order()">
Order
</button>

</div>

<script>

const products = [

["Rava 500 g","grocery",30],

["Maida 500 g","grocery",25],

["Moong Dal 1 kg","dal",110],

["Arhar Dal 1 kg","dal",120],

["Chola Chana 1 kg","dal",120],

["Mungfali Dana 1 kg","grocery",140],

["Rajma 1 kg","dal",140],

["Tata Namak 1 kg","grocery",30],

["Pasta 1 kg","grocery",60],

["Macaroni 1 kg","grocery",50],

["Haldi 200 g","masala",60],

["Dhaniya 200 g","masala",50],

["Mirch 200 g","masala",70]

];

let cart = [];

let locationLink = "";


function showProducts(list = products){

const box = document.getElementById("products");

box.innerHTML = "";

list.forEach(p => {

box.innerHTML += `

<div class="product">

<h3>${p[0]}</h3>

<div class="price">
₹${p[2]}
</div>

<button onclick="addToCart('${p[0]}',${p[2]})">
Add to Cart
</button>

</div>

`;

});

}


function addToCart(name,price){

cart.push({
name:name,
price:price
});

document.getElementById("count").innerText =
cart.length;

}


function filterProducts(category){

if(category === "all"){

showProducts();

}else{

showProducts(
products.filter(p => p[1] === category)
);

}

}


document.getElementById("search")
.addEventListener("input",function(){

const text =
this.value.toLowerCase();

showProducts(

products.filter(p =>
p[0].toLowerCase().includes(text)
)

);

});


function shareLocation(){

if(!navigator.geolocation){

alert("Location is not supported on this phone.");

return;

}

document.getElementById("locationStatus").innerText =
"📍 Getting your location...";


navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

locationLink =
"https://www.google.com/maps?q=" +
lat + "," + lon;

document.getElementById("locationStatus").innerText =
"✅ Location added successfully";

},

function(){

document.getElementById("locationStatus").innerText =
"❌ Location permission denied";

alert(
"Please allow location permission in Chrome."
);

}

);

}


function order(){

if(cart.length === 0){

alert(
"Please add products to cart first."
);

return;

}


const name =
document.getElementById("customerName").value.trim();

const mobile =
document.getElementById("mobile").value.trim();

const address =
document.getElementById("address").value.trim();


if(name === ""){

alert("Please enter your name.");

return;

}


if(mobile === ""){

alert("Please enter your mobile number.");

return;

}


if(address === ""){

alert("Please enter your delivery address.");

return;

}


let total = 0;

let items = "";


cart.forEach(function(item,index){

total += item.price;

items +=
(index + 1) +
". " +
item.name +
" - ₹" +
item.price +
"\n";

});


let message =

"🛒 DAILY KART ORDER\n\n" +

"👤 Name: " +
name +
"\n" +

"📞 Mobile: " +
mobile +
"\n" +

"🏠 Address: " +
address +
"\n\n" +

"📦 ITEMS:\n" +

items +

"\n💰 Total: ₹" +
total +
"\n";


if(locationLink !== ""){

message +=
"\n📍 Delivery Location:\n" +
locationLink +
"\n";

}else{

message +=
"\n📍 Location: Not provided\n";

}


message +=
"\nThank you for ordering from Daily Kart!";


const whatsappURL =

"https://wa.me/918840299142?text=" +

encodeURIComponent(message);


window.location.href = whatsappURL;

}


showProducts();

</script>
<div style="background:white;margin:15px;padding:18px;border-radius:12px;box-shadow:0 2px 8px #ddd;text-align:center;">
  <h2>💳 UPI Payment</h2>
  <p>UPI ID: <b>karanomer009@ybl</b></p>

  <a href="upi://pay?pa=karanomer009@ybl&pn=Daily%20Kart&cu=INR"
     style="display:inline-block;background:#1b7f3a;color:white;padding:13px 20px;border-radius:8px;text-decoration:none;font-weight:bold;">
     💰 Pay with UPI
  </a>

  <p style="font-size:13px;color:#666;">
    UPI app kholkar payment karein.
  </p>
</div>
</body>
</html>
